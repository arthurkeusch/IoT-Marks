<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">

  <!-- - - -
    Styles
  - - - - -->
  
  <style>
    svg {
      --color-light: #008FBF;
      --color-dark: #0A2342;
      --color-medium: #0C4C72;

      --speed: 0.25;
      animation: svg-rainbow  calc(var(--speed, 0) * 5s)   linear infinite,
                 svg-rotate   calc(var(--speed, 0) * 10s)  linear infinite,
                 svg-shrink   calc(var(--speed, 0) * 2.5s) linear infinite;
    }

    @keyframes svg-rainbow {
      from { filter: hue-rotate(0deg); }
      to   { filter: hue-rotate(360deg); }
    }

    @keyframes svg-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes svg-shrink {
      0%   { scale: 1; }
      35%  { scale: 0.75; }
      45%  { scale: 0.66; }
      50%  { scale: 0.65; }
      55%  { scale: 0.66; }
      65%  { scale: 0.75; }
      100% { scale: 1; }
    }
  </style>

  <!-- Small shadow -->
  <filter id="shadow-s" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
  </filter>

  <!-- Medium shadow -->
  <filter id="shadow-m" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
  </filter>

  <!-- Large shadow -->
  <filter id="shadow-l" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="3" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
  </filter>

  <!-- - - - - - -
    'Internal M'
  - - - - - - - -->
  
  <g filter="url(#shadow-s)">
    <!-- Lines (we use a polygon to make a clean shape) -->
    <g fill="var(--color-light)">
      <polygon points="87.5,300   87.5,142.75   162.5,217.75  162.5,257.25  112.5,207.25  112.5,300" />
      <polygon points="312.5,300  312.5,142.75  237.5,217.75  237.5,257.25  287.5,207.25  287.5,300" />
    </g>
  </g>

  <g filter="url(#shadow-l)">
    <g fill="var(--color-light)">
      <!-- Bottom points -->
      <circle cx="100" cy="300" r="25" />
      <circle cx="300" cy="300" r="25" />

      <!-- Point at the end of the right line -->
      <circle cx="237.5" cy="237.5" r="25" />
    </g>
  </g>

  <!-- - - - - - -
    'External M'
  - - - - - - - -->

  <g filter="url(#shadow-s)">
    <g fill="none" stroke="var(--color-dark)" stroke-width="26">
      <!-- Vertical lines -->
      <line x1="50"  y1="75" x2="50"  y2="325" />
      <line x1="350" y1="75" x2="350" y2="325" />

      <!-- Diagonal lines -->
      <line x1="65"  y1="60" x2="162.5" y2="162.5"  />
      <line x1="335" y1="65" x2="162.5" y2="237.5" />
    </g>
  </g>

  <g filter="url(#shadow-m)">
    <!-- External rings -->
    <g fill="none" stroke="var(--color-dark)" stroke-width="20">
      <circle cx="50"  cy="50"  r="25" />
      <circle cx="50"  cy="350" r="25" />
      <circle cx="350" cy="50"  r="25" />
      <circle cx="350" cy="350" r="25" />
    </g>
  </g>

    <!-- Point at the end of the left line -->
  <g filter="url(#shadow-l)">
    <g fill="var(--color-dark)">
      <circle cx="162.5" cy="162.5" r="25" />
    </g>
  </g>

  <!-- - - - - - - - -
    Link between M's
  - - - - - - - - - -->

  <g filter="url(#shadow-l)">
    <g fill="var(--color-medium)">
      <circle cx="162.5" cy="237.5" r="25" />
    </g>
  </g>
</svg>